name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5 mypy==2.4.1
      - run: make lint

  fast-tests:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - name: Install Macaulay2, Python and make
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            macaulay2 make coreutils python3 git ca-certificates
      - uses: actions/checkout@v4
      - run: make test
      - name: The generated claim tables are up to date
        run: make check
      - name: The invariants batch, and the headline table of the README from it
        run: make smoke
      - name: The negative control ends as three mismatches, with status 1
        run: |
          status=0
          python3 -m k3batch run batches/negative-control.toml --memory-guard poll || status=$?
          test "$status" -eq 1
          python3 - <<'PY'
          from pathlib import Path

          from k3batch.store import ResultStore

          store = ResultStore(Path("results/negative-control/results.jsonl"))
          statuses = [record["status"] for record in store.records()]
          if statuses != ["mismatch"] * 3:
              raise SystemExit(f"Expected three mismatches, got {statuses}")
          PY

  # The package tests that compute Ext groups: under two minutes on a desktop, 0.5 GB at most.
  slow-tests:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: Install Macaulay2 and make
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            macaulay2 make coreutils git ca-certificates
      - uses: actions/checkout@v4
      - run: make test-slow
