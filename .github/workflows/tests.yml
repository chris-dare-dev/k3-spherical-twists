name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The owner's self-hosted runners serve only private CI copies of this repository, which set the
# variable OWNER_CI_RUNS_ON to a runner label list such as ["self-hosted","owner-ci"]. There `lean`
# runs on those runners and the other jobs are skipped. Here and in forks the variable is unset.
jobs:
  lint:
    if: ${{ !vars.OWNER_CI_RUNS_ON }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5 mypy==2.4.1
      - run: make lint
      - name: The root holds src/, tests/, data/ and the standard files
        run: python3 .github/check_root.py
      - name: The boxes of src/batch import downward, through their interfaces
        run: python3 .github/check_boxes.py

  fast-tests:
    if: ${{ !vars.OWNER_CI_RUNS_ON }}
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - name: Install Macaulay2, Python and make
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            macaulay2 make coreutils python3 git ca-certificates
      - uses: actions/checkout@v4
      - run: make test
      - name: The generated claim tables are up to date
        run: make check
      - name: The invariants batch, and the headline table of the guide from it
        run: make smoke
      - name: The negative control ends as three mismatches, with status 1
        run: |
          status=0
          PYTHONPATH=src python3 -m batch run data/batches/negative-control.toml --memory-guard poll || status=$?
          test "$status" -eq 1
          PYTHONPATH=src python3 - <<'PY'
          from pathlib import Path

          from batch.records import ResultStore

          store = ResultStore(Path("results/negative-control/results.jsonl"))
          statuses = [record["status"] for record in store.records()]
          if statuses != ["mismatch"] * 3:
              raise SystemExit(f"Expected three mismatches, got {statuses}")
          PY

  # The package tests that compute Ext groups: under two minutes on a desktop, 0.5 GB at most.
  slow-tests:
    if: ${{ !vars.OWNER_CI_RUNS_ON }}
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - name: Install Macaulay2 and make
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            macaulay2 make coreutils git ca-certificates
      - uses: actions/checkout@v4
      - run: make test-slow

  # The Lean proofs under src/lean: a warning (a `sorry`, say) fails the build; then the test
  # library, Batteries' linters, the generated umbrella, the axiom audit, the cited-name check and
  # the style check.
  lean:
    # Not the trust boundary: a pull request can edit this line. The boundary is that no runner is
    # registered to this public repository, so a job asking for `self-hosted` here stays queued.
    runs-on: ${{ vars.OWNER_CI_RUNS_ON && fromJSON(vars.OWNER_CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.OWNER_CI_RUNS_ON && 60 || 30 }}
    steps:
      # `clean: false` keeps src/lean/.lake between runs on a self-hosted runner; the next step does
      # the rest of what checkout's clean would have done.
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Reset the tree, keeping .lake
        run: |
          git reset --hard
          git clean -ffdx -e .lake
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: src/lean
          build-args: --wfail
      - name: Tests, linters, umbrella, axioms and style
        run: make lean
