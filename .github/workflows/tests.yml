name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: make lint

  fast-tests:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    steps:
      - name: Install Macaulay2, Python and make
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            macaulay2 make coreutils python3 git ca-certificates
      - uses: actions/checkout@v4
      - run: make test
