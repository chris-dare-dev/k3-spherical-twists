[project]
name = "k3batch"
version = "0.2"
description = "Runs batches of Macaulay2 tasks for K3Twists under time and memory limits"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.ruff]
src = ["src", "tests"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
# sentences of the generated pages and rows of tables, kept on one line each
"src/bookkeeping/claims.py" = ["E501"]
"tests/test_claims.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/k3batch", "src/bookkeeping/adopt.py", "src/bookkeeping/claims.py"]
mypy_path = "src"
