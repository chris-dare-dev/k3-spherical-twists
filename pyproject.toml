[project]
name = "batch"
version = "0.2"
description = "Runs the K3Twists computations in batches under time and memory limits, and keeps their records and claims"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.ruff]
src = ["src", "tests"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
# sentences of the generated pages and rows of tables, kept on one line each
"src/batch/claims/tables.py" = ["E501"]
"tests/batch/claims/test_claims.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/batch"]
mypy_path = "src"
