  '''ℚ[u,v] at the origin''',
]
tasks = ["hn_arrow/fibre-*"]

[[claim]]
id = "quartic-point-cut-arrows"
table = "hn-arrows"
cells = [
  '''T_O(kₓ) and T_O⁻¹(Iₓ[1]) at the strict cut above phase 1''',
