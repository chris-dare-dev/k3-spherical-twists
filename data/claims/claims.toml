  '''Zero or tangent map k[−1] → k, with an unmapped k[−1] target summand''',
  '''Upper summand inclusions of k ⊕ k and Dᵤ, each of length 2 with lower length 1. Their radicals have lengths 0 and 1.''',
  '''ℚ[u,v] at the origin''',
]
tasks = ["hn_arrow/cone-*"]

[[claim]]
id = "punctual-fibre-arrows"
table = "hn-arrows"
cells = [
  '''Socle inclusion k → fib(Dₐ → k → Dᵦ) over the given fibre''',
