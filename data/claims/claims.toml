# The registry of claims: every row of the claim tables of CLAIMS.md.
#
# `make tables` (src/batch/claims/tables.py) writes the tables of CLAIMS.md, the file data/claims/RECORDS.md and the headline table of
# GUIDE.md from this file, from the batch files (which tasks exist) and from the records in data/records/.
# `make check` fails if the committed tables differ from what it writes.
#
# A table has a heading of CLAIMS.md and its columns.  A claim has an id, its table, the cells of its
# row in the order of the columns (Markdown, as printed), and `tasks`: ids of the tasks that compute
# it, where `*` stands for any run of characters.  A `*` may not follow a digit: `d2*` would also take
# d = 20, so the ids of one parameter value are written out.  `batches`, when given, keeps the tasks of
# those batches only: the dependent batches use the same ids for different objects.  A claim without
# tasks says why in `no_task`.
# Synthetic tasks and tasks with IDs ending in !control are excluded from claims.

[table.sheaves]
heading = '''Cohomology of the sheaves of short words'''
columns = ['''Claim''', '''Predicted, with n = d + 2''', '''Surfaces''']

[[claim]]
id = "line-bundles"
table = "sheaves"
cells = [
  '''hⁱ(O), hⁱ(O(H)), hⁱ(O(−H))''',
  '''(1, 0, 1), (n, 0, 0), (0, 0, n)''',
  '''d = 2, 3, 4''',
]
tasks = ["invariant/d*-p32003-s1/h^i(O)", "invariant/d*-p32003-s1/h^i(O(H))", "invariant/d*-p32003-s1/h^i(O(-H))"]

[[claim]]
id = "ideal-of-the-point"
table = "sheaves"
