  '''(0, 0, 1), (0, 1, n), (n − 1, 0, 0); n − 1''',
  '''d = 2, 3, 4''',
]
tasks = [
  "invariant/d*-p32003-s1/h^i(I_x)",
  "invariant/d*-p32003-s1/h^i(I_x(-H))",
  "invariant/d*-p32003-s1/h^i(I_x(H))",
  "invariant/d*-p32003-s1/generators of I_x(H)",
]

